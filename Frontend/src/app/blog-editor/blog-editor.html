<div class="editor-page">
  <div class="editor-header">
    <a routerLink="/blog" class="back-link">← Back to Blog</a>
    <h1>{{ editingId ? 'Edit Post' : 'New Blog Post' }}</h1>
  </div>

  <form (ngSubmit)="save()" class="editor-form">
    <div class="form-group">
      <label for="title">Title</label>
      <input
        id="title"
        type="text"
        [(ngModel)]="title"
        name="title"
        placeholder="Enter post title…"
        required
      />
    </div>

    <div class="form-group">
      <label for="author">Author Name</label>
      <input
        id="author"
        type="text"
        [(ngModel)]="authorName"
        name="authorName"
        placeholder="Admin"
      />
    </div>

    <div class="form-group">
      <label>Content</label>
      <div class="toolbar">
        <button type="button" (click)="execCmd('bold')" title="Bold"><b>B</b></button>
        <button type="button" (click)="execCmd('italic')" title="Italic"><i>I</i></button>
        <button type="button" (click)="execCmd('underline')" title="Underline"><u>U</u></button>
        <span class="divider"></span>
        <button type="button" (click)="insertHeading()" title="Heading">H2</button>
        <button type="button" (click)="insertParagraph()" title="Paragraph">¶</button>
        <span class="divider"></span>
        <button type="button" (click)="execCmd('insertUnorderedList')" title="Bullet list">• List</button>
        <button type="button" (click)="execCmd('insertOrderedList')" title="Numbered list">1. List</button>
      </div>
      <div
        class="rich-editor"
        contenteditable="true"
        [innerHTML]="content"
        (input)="onContentChange($event)"
        data-placeholder="Write your blog post here…"
      ></div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="saving()">
        {{ saving() ? 'Saving…' : (editingId ? 'Update Post' : 'Publish Post') }}
      </button>
      <a routerLink="/blog" class="btn btn-cancel">Cancel</a>
    </div>
  </form>
</div>
